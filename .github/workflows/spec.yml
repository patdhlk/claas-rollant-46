name: spec
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Strict gate
        # pds is not published yet; use the raw builders as the gate.
        # When pds is available, replace these two lines with: pds check
        run: |
          uv run sphinx-build -W -b html spec spec/_build/html
          uv run sphinx-build -b needs spec spec/_build/needs
