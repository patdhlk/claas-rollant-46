[package]
name = "baler-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Off by default: the host build uses the Sim* ports and stays dependency-light.
default = []

# Granular edges so a safe on-device demo can run WITHOUT taktora/EtherCAT:
#   --features transport,watchdog-hw  → Sim bus/net + real watchdog + iceoryx2,
#   publishes live state to baler-ui without ever touching eth0 or a coupler.
# The UI⇄daemon link runs over taktora's transport-iox connector (ISSUE_0011).
transport = [
    "dep:iceoryx2",
    "dep:taktora-connector-core",
    "dep:taktora-connector-transport-iox",
]
ethercat = [
    "dep:taktora-executor",
    "dep:taktora-connector-core",
    "dep:taktora-connector-host",
    "dep:taktora-connector-transport-iox",
    "dep:taktora-connector-ethercat",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
watchdog-hw = ["dep:nix", "dep:libc", "dep:log"]
netmode-hw = []

# The full device build (coupler connected).
hardware = ["transport", "ethercat", "watchdog-hw", "netmode-hw"]

[dependencies]
baler-core = { path = "../baler-core" }

# Logging backend so ethercrab/taktora `log` output (slave enumeration, bus
# state) is captured during bring-up; the daemon's own diagnostics use eprintln!.
env_logger = "0.11"

# iceoryx2 node/config for the UI⇄daemon transport-iox link. Only compiled with
# `transport`; the host build never pulls it in. (iceoryx2 0.8 builds for the
# aarch64 gnu target via `cross`; musl cannot build it.)
iceoryx2 = { version = "0.8", optional = true, default-features = false }

# --- optional, compiled only under the features above ---
# taktora ethercat-wago connector stack (REQ_0015). Pin to a rev for repro.
taktora-executor = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }
taktora-connector-core = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }
taktora-connector-host = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }
taktora-connector-transport-iox = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }
taktora-connector-ethercat = { git = "https://github.com/patdhlk/taktora", branch = "main", features = ["bus-integration"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Multi-threaded tokio runtime so ethercrab's continuous tx/rx network task runs
# concurrently with the executor's cyclic items. The working example
# (taktora examples/ethercat-wago-coupler) enables exactly these features; without
# rt-multi-thread the tx/rx task is starved and the master sends the initial BRD
# but never receives a reply ("Dropping in-flight future, timeout").
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"], optional = true }

# /dev/watchdog ioctl (REQ_0010)
nix = { version = "0.29", optional = true, default-features = false, features = ["ioctl"] }
libc = { version = "0.2", optional = true }
log = { version = "0.4", optional = true }
