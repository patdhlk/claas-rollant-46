[package]
name = "baler-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []

# Standalone framebuffer UI: Slint + cr1140-hal + the real baler-core control
# logic running in-process. No iceoryx2, no daemon — builds to static aarch64
# musl and runs by itself on the panel. This is the on-device demo.
device = ["dep:slint", "dep:cr1140-hal", "dep:slint-build"]

# Split-process build: same UI, but state comes from baler-daemon over the
# taktora transport-iox iceoryx2 link instead of the in-process logic (ISSUE_0011).
# (iceoryx2 0.8 does not yet cross-compile to musl — see notes; use a glibc target.)
transport = [
    "device",
    "dep:iceoryx2",
    "dep:taktora-connector-core",
    "dep:taktora-connector-transport-iox",
]

# Alias for the full split-process device build.
hardware = ["transport"]

[dependencies]
# The IPC contract types (Mode/Command/StateSnapshot) and the in-process control
# logic both live here now (ISSUE_0011 — baler-ipc was removed); always needed.
baler-core = { path = "../baler-core" }

# taktora transport-iox link to baler-daemon (only under `transport`).
iceoryx2 = { version = "0.8", optional = true, default-features = false }
taktora-connector-core = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }
taktora-connector-transport-iox = { git = "https://github.com/patdhlk/taktora", branch = "main", optional = true }

# Slint with NO system backend and NO std font loading — pure-Rust so it
# cross-compiles to aarch64. Fonts embedded at build time (build.rs).
slint = { version = "1.12", default-features = false, optional = true, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

# Raw hardware: FbDisplay (fbdev), ButtonReader (evdev), set_led_typed (sysfs).
cr1140-hal = { git = "https://github.com/UpTux/ifm-cr1140", optional = true }

[build-dependencies]
# Enabled by the `device` feature; build.rs only references it under
# `#[cfg(feature = "device")]`, so the host build neither fetches nor runs it.
slint-build = { version = "1.12", optional = true }
